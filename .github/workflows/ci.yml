name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fire-safety-lab/package-lock.json

      - name: Install dependencies
        working-directory: fire-safety-lab
        run: npm ci

      - name: Lint
        working-directory: fire-safety-lab
        run: npm run lint

      - name: Run tests
        working-directory: fire-safety-lab
        run: npm test

      - name: Build
        working-directory: fire-safety-lab
        run: npm run build
